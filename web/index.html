<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tm_classifier">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>tm_classifier</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- web only: tflite_flutter doesn't work in the browser, so the web build
       runs the same model.tflite with tfjs-tflite -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.9.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.9.0/dist/tf-backend-cpu.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>
  <script>
    window.tmLoad = async function (url) {
      tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/wasm/');
      window.tmModel = await tflite.loadTFLiteModel(url);
      const i = tmModel.inputs[0], o = tmModel.outputs[0];
      return JSON.stringify({inDtype: i.dtype, inShape: i.shape, outShape: o.shape});
    };
    // rgb: flat R,G,B bytes of a size x size image. returns the raw output scores
    window.tmPredict = function (rgb, size, asFloat) {
      return tf.tidy(() => {
        const x = asFloat
          ? tf.tensor(Float32Array.from(rgb, v => v / 127.5 - 1), [1, size, size, 3], 'float32')
          : tf.tensor(Int32Array.from(rgb), [1, size, size, 3], 'int32');
        const y = tmModel.predict(x);
        const t = y instanceof tf.Tensor ? y : Object.values(y)[0];
        return Float32Array.from(t.dataSync());
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
